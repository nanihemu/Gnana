services:
  gnana:
    build: .
    image: gnana:latest
    env_file: .env
    volumes:
      - gnana_data:/data          # SQLite DB + uploads + generated videos
    ports:
      - "8000:8000"               # direct access (http://SERVER:8000). Remove if you use the https profile.
    restart: unless-stopped

  # Optional automatic HTTPS (Let's Encrypt). Needs DOMAIN in .env and ports 80/443 open.
  # Start with:  docker compose --profile https up -d
  caddy:
    image: caddy:2
    profiles: ["https"]
    depends_on:
      - gnana
    environment:
      - DOMAIN=${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  gnana_data:
  caddy_data:
  caddy_config:
